name: Build Pip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge starter project and add Pip
        run: |
          unzip -q pip-forge-1.20.1.zip -d pipsrc
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r pipsrc/pip-forge/src mdk/src
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=pip/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.pip/' gradle.properties
          cat >> build.gradle <<'EOF'

          jarJar.enable()
          tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
          reobf { jarJar { } }
          repositories { maven { url = 'https://maven.maxhenkel.de/repository/public' } }
          dependencies {
            compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
            implementation 'com.alphacephei:vosk:0.3.45'
            jarJar(group: 'com.alphacephei', name: 'vosk', version: '[0.3.45,0.4)') { jarJar.pin(it, '0.3.45') }
          }
          EOF
          chmod +x gradlew

      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pip-mod
          path: mdk/build/libs/*.jar
